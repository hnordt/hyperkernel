name: Feature request
description: Propose behavior that supports the bounded v0.1 proof.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the application flow or user outcome, not only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest observable behavior that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Why does this belong in v0.1?
      description: Name the reference application flow that requires this capability.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds or smaller approaches you considered.
